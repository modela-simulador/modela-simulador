<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Modela — Cargando plataforma…</title>
  <meta http-equiv="refresh" content="0; url=/modela-simulador/" />
  <link rel="canonical" href="/modela-simulador/" />
  <script>
    // Redirección dinámica a la nueva landing (login + selector).
    // Funciona tanto en dev local (/simulador.html → /) como en Pages
    // (/modela-simulador/simulador.html → /modela-simulador/).
    (function () {
      var target = window.location.pathname.replace(/simulador\.html$/, "");
      if (!target) target = "/";
      window.location.replace(target);
    })();
  </script>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
      background: linear-gradient(135deg, #1A1825 0%, #153E6B 100%);
      color: rgba(255,255,255,0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .msg { font-size: 14px; letter-spacing: 0.05em; }
  </style>
</head>
<body>
  <div class="msg">
    Cargando plataforma Modela…
    <br/>
    <a href="./" style="color:#c4b58a;text-decoration:none;">Continuar</a>
  </div>
</body>
</html>
